<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateTimePicker Playground</title>

    <!-- Optional Bootstrap -->
    <link id="bootstrap-css" rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
          crossorigin="anonymous" disabled>
    <link rel="stylesheet" href="datetimepicker.css">

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            max-width: 1400px;
        }

        h1 {
            margin-bottom: 1.5rem;
        }

        details {
            margin-bottom: 2rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            background: #fafafa;
            transition: background 0.2s, border-color 0.2s;
        }

        summary {
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .picker-row {
            display: grid;
            grid-template-columns: 1fr 320px; /* left: picker | right: options */
            gap: 1.5rem;
            align-items: flex-start;
            width: 100%;
        }

        @media (max-width: 768px) {
            .picker-row {
                grid-template-columns: 1fr;
            }
        }

        .picker-box {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 1rem;
            min-height: 320px;
            background: white;
            transition: background 0.2s, border-color 0.2s;
        }

        fieldset {
            border: none;
            background: #fff;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            max-height: 560px;
            overflow: auto;
        }

        .option-row {
            margin-bottom: 0.65rem;
            border-bottom: 1px dashed #ececec;
            padding-bottom: 0.45rem;
        }

        .option-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .snippet-box {
            margin-top: 1rem;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .snippet-box summary {
            cursor: pointer;
            font-weight: 600;
            padding: 0.65rem 0.75rem;
            margin: 0;
        }

        .snippet-box-content {
            padding: 0 0.75rem 0.75rem;
        }

        .snippet-box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .snippet-box textarea {
            width: 100%;
            min-height: 180px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.8rem;
        }

        fieldset label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0.3rem 0;
        }

        .switch {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .switch input {
            width: 1.25rem;
            height: 1.25rem;
        }

        fieldset > label > input {
            flex: 0;
        }

        /* Dark mode for details and picker-box */
        body[data-bs-theme="dark"] details {
            background: #23272b;
            border-color: #444;
            color: #f1f1f1;
        }
        body[data-bs-theme="dark"] .picker-box {
            background: #23272b;
            border-color: #444;
            color: #f1f1f1;
        }
        body[data-bs-theme="dark"] fieldset {
            background: #23272b;
            color: #f1f1f1;
        }


        body[data-bs-theme="dark"] .snippet-box {
            background: #1c1f22;
            border-color: #444;
        }
    </style>
</head>
<body data-bs-theme="light">

<h1>DateTimePicker Interactive Playground</h1>
<label class="switch">
    <input type="checkbox" id="toggle-bootstrap">
    Use Bootstrap Styles
</label>
<span id="dark-toggle-container" style="display:none;">
    <label class="switch">
        <input type="checkbox" id="toggle-dark">
        Dark Theme
    </label>
</span>

<!-- Inline Picker -->
<details open>
    <summary>Inline Picker</summary>
    <div class="picker-row">
        <div class="picker-box" id="inline-wrapper"></div>
        <fieldset id="inline-options"></fieldset>
    </div>
</details>

<!-- Input Picker -->
<details>
    <summary>Input Picker</summary>
    <div class="picker-row">
        <div class="picker-box" id="input-wrapper"></div>
        <fieldset id="input-options"></fieldset>
    </div>
</details>

<!-- Button Picker -->
<details>
    <summary>Button Picker</summary>
    <div class="picker-row">
        <div class="picker-box" id="button-wrapper"></div>
        <fieldset id="button-options"></fieldset>
    </div>
</details>

<script src="datetimepicker.js"></script>
<script src="playground.js"></script>
</body>
</html>
